name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
  run: |
    pnpm config set dangerouslyAllowAllBuilds true
    pnpm install --no-frozen-lockfile

      - name: Build web app
        working-directory: artifacts/lex-qnt-scalper
        run: pnpm build

      - name: Sync Capacitor iOS
        working-directory: artifacts/lex-qnt-scalper
        run: pnpm exec cap sync ios

      - name: Build iOS project
        run: |
          xcodebuild \
            -project artifacts/lex-qnt-scalper/ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build