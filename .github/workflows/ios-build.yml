name: iOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile --ignore-scripts
          pnpm rebuild esbuild

      - name: Build web app
        working-directory: artifacts/lex-qnt-scalper
        run: pnpm build

      - name: Sync Capacitor iOS
        working-directory: artifacts/lex-qnt-scalper
        run: pnpm exec cap sync ios

      - name: Verify Xcode project
        run: |
          echo "Checking iOS project..."
          ls -la artifacts/lex-qnt-scalper/ios/App
          test -d artifacts/lex-qnt-scalper/ios/App/App.xcodeproj

      - name: Build iOS project
        run: |
          xcodebuild \
            -project artifacts/lex-qnt-scalper/ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build