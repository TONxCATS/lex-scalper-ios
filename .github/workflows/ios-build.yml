name: iOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable

      - name: Configure pnpm
        run: |
          pnpm config set --location=project --json allowBuilds '{"esbuild":true}'

      - name: Install dependencies
        run: |
          rm -rf node_modules
          rm -rf artifacts/lex-qnt-scalper/node_modules
          pnpm install --no-frozen-lockfile --force

      - name: Build web app
        working-directory: artifacts/lex-qnt-scalper
        env:
          PORT: 5173
          BASE_PATH: /
          NODE_ENV: production
          CI: "false"
        run: pnpm run build

      - name: Check web build
        run: |
          test -d artifacts/lex-qnt-scalper/dist/public
          ls -la artifacts/lex-qnt-scalper/dist/public

      - name: Sync Capacitor iOS
        working-directory: artifacts/lex-qnt-scalper
        env:
          PORT: 5173
          BASE_PATH: /
          NODE_ENV: production
        run: pnpm exec cap sync ios

      - name: Verify Xcode project
        run: |
          test -d artifacts/lex-qnt-scalper/ios/App/App.xcodeproj
          ls -la artifacts/lex-qnt-scalper/ios/App

      - name: Build iOS project
        run: |
          xcodebuild \
            -project artifacts/lex-qnt-scalper/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build